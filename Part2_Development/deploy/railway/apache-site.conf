# ML IT Helpdesk - Apache site inside the container.
# Railway terminates HTTPS at its edge and forwards to ${PORT}.
<VirtualHost *:${PORT}>
    ServerName localhost
    DocumentRoot /var/www/app/public

    # Only app/public is reachable; config/, src/ and storage/ never are
    <Directory /var/www/app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    Header always set Strict-Transport-Security "max-age=31536000"
    ServerSignature Off

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
