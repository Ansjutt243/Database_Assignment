# =====================================================================
# Apache 2.4 front end for the ML IT Helpdesk (Design Document 2.3.3)
#  - HTTPS on port 8443 (TLS 1.2), HTTP 8081 redirects to HTTPS
#  - forwards requests to the PHP application server on 127.0.0.1:8080
#  - only app/public is reachable; config/, src/ and storage/ are never served
# Started by deploy/apache/start_apache.sh, which fills in @ROOT@.
# Production: use ports 443/80, a certificate from ML's certificate authority,
# and PHP-FPM through mod_proxy_fcgi instead of the PHP built-in server.
# =====================================================================
ServerRoot "/usr"
Listen 127.0.0.1:8443
Listen 127.0.0.1:8081
ServerName localhost
PidFile "@ROOT@/deploy/apache/run/httpd.pid"
DefaultRuntimeDir "@ROOT@/deploy/apache/run"
Mutex file:@ROOT@/deploy/apache/run default

LoadModule mpm_event_module      libexec/apache2/mod_mpm_event.so
LoadModule authz_core_module     libexec/apache2/mod_authz_core.so
LoadModule authz_host_module     libexec/apache2/mod_authz_host.so
LoadModule unixd_module          libexec/apache2/mod_unixd.so
LoadModule log_config_module     libexec/apache2/mod_log_config.so
LoadModule mime_module           libexec/apache2/mod_mime.so
LoadModule headers_module        libexec/apache2/mod_headers.so
LoadModule rewrite_module        libexec/apache2/mod_rewrite.so
LoadModule reqtimeout_module     libexec/apache2/mod_reqtimeout.so
LoadModule socache_shmcb_module  libexec/apache2/mod_socache_shmcb.so
LoadModule ssl_module            libexec/apache2/mod_ssl.so
LoadModule proxy_module          libexec/apache2/mod_proxy.so
LoadModule proxy_http_module     libexec/apache2/mod_proxy_http.so

ErrorLog  "@ROOT@/app/storage/logs/apache_error.log"
LogFormat "%h %u %t \"%r\" %>s %b %D" timed
CustomLog "@ROOT@/app/storage/logs/apache_access.log" timed
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 60

<Directory />
    Require all denied
</Directory>

# --- plain HTTP: always redirect to HTTPS
<VirtualHost 127.0.0.1:8081>
    RewriteEngine On
    RewriteRule ^(.*)$ https://localhost:8443$1 [R=301,L]
</VirtualHost>

# --- HTTPS
SSLSessionCache "shmcb:@ROOT@/deploy/apache/run/ssl_scache(512000)"
<VirtualHost 127.0.0.1:8443>
    SSLEngine on
    # macOS Apache (LibreSSL) offers up to TLS 1.2 here; add +TLSv1.3 on Linux
    SSLProtocol -all +TLSv1.2
    SSLCertificateFile    "@ROOT@/deploy/apache/ssl/server.crt"
    SSLCertificateKeyFile "@ROOT@/deploy/apache/ssl/server.key"

    # Security headers (NFR-02). X-Frame-Options and nosniff come from PHP.
    Header always set Strict-Transport-Security "max-age=31536000"

    # Pass everything to the PHP application server (it serves app/public only)
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader set X-Forwarded-Proto "https"
    <Location />
        Require ip 127.0.0.1
    </Location>
</VirtualHost>
